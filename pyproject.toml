[project]
name = "googlenestcam"
version = "0.1.0"
description = "Quick access to Google Nest Cameras for Python developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
onepassword = [
    "onepassword-sdk>=0.4.1",
]
images = [
    "pillow>=12.3.0",
]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "real_camera: needs a real Token, Credentials and Camera; run with `make test_real_cameras`",
]

[tool.ruff]
# Issue notes and agent worktrees, not package code.
extend-exclude = [".scratch", ".claude"]

[tool.ruff.lint]
select = ["D", "E", "F", "UP", "RUF", "ASYNC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ty.src]
# Agent worktrees hold other checkouts of this repo.
exclude = [".claude"]

[tool.ty.analysis]
# Notebooks use these if you install them; they are in no extra.
allowed-unresolved-imports = ["torch", "tensorflow", "whisper"]
